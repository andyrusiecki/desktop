[workbench]
image=docker.io/library/archlinux:latest:latest
replace=true

pre_init_hooks=[ -f /root/.distrobox_workbench_first_run ] || ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman

pre_init_hooks=[ -f /root/.distrobox_workbench_first_run ] || ln -sf /usr/local/bin/podman /usr/local/bin/docker
pre_init_hooks=[ -f /root/.distrobox_workbench_first_run ] || ln -sf /usr/bin/podman-compose /usr/local/bin/docker-compose

pre_init_hooks=[ -f /root/.distrobox_workbench_first_run ] || ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/flatpak
pre_init_hooks=[ -f /root/.distrobox_workbench_first_run ] || ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/xdg-open

additional_packages="aws-cli-v2 base-devel bat btop cargo eza fastfetch fd-find fish fzf git-delta git-lfs golang helix kubectl neovim nodejs podman-compose ripgrep rust rust-src starship yazi yq zoxide"

init_hooks=[ -f /root/.distrobox_workbench_first_run ] || (git clone https://aur.archlinux.org/paru.git /tmp/parugit && cd paru && makepkg -si --noconfirm && cd .. && rm -rf parugit)
init_hooks=[ -f /root/.distrobox_workbench_first_run ] || paru -S --noconfirm --needed aurutils claude-code downgrade kubecolor lazydocker-bin

init_hooks=[ -f /root/.distrobox_workbench_first_run ] || chsh -s /usr/bin/fish
